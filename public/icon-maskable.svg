      <rect x="196" y="120" width="60" height="36" rx="6"/>
      <rect x="272" y="120" width="60" height="36" rx="6"/>
      <rect x="158" y="172" width="60" height="36" rx="6"/>
      <rect x="234" y="172" width="60" height="36" rx="6"/>
