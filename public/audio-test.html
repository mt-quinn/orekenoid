<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orekanoid audio test</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 20px 16px 60px;
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    background: #14140f; color: #f1eadb;
  }
  h1 { font-size: 16px; letter-spacing: .14em; margin: 0 0 4px; }
  h2 {
    font-size: 12px; letter-spacing: .16em; margin: 22px 0 6px;
    color: #d98a52; border-bottom: 1px solid #3a352a; padding-bottom: 4px;
  }
  p.lead { margin: 0 0 14px; color: #9a927d; max-width: 74ch; }
  .row { margin: 0 0 3px; white-space: pre-wrap; word-break: break-word; }
  .pass { color: #7fbf7f; }
  .fail { color: #e06c4f; }
  .info { color: #d9c48a; }
  .dim { color: #8b8672; }
  button {
    font: inherit; font-weight: 700; letter-spacing: .08em;
    padding: 12px 18px; min-height: 46px; margin: 0 8px 8px 0;
    color: #17150f; background: #d98a52; border: 0; border-radius: 3px; cursor: pointer;
  }
  button.alt { color: #f1eadb; background: none; border: 1px solid #6b6455; }
</style>
</head>
<body>
<h1>OREKANOID &middot; AUDIO TEST</h1>
<p class="lead">
  Every question is asked two ways so the answers can be compared: over the network and from bytes already in
  memory, with a known-good file as a control. Screenshot the whole thing, including the dim lines.
</p>
<button id="run" type="button">RUN THE TEST</button>
<button id="copy" type="button" class="alt" disabled>COPY REPORT</button>
<button id="killsw" type="button" class="alt">UNREGISTER SERVICE WORKER, THEN RE-RUN</button>
<div id="out"></div>
<!-- The same text, selectable, for a browser that refuses the clipboard API. Nothing here is lost in either
     form: it is the exact strings the page printed, which is better evidence than a picture of them. -->
<textarea id="dump" readonly hidden rows="16" style="width:100%;margin-top:18px;font:inherit;
  background:#0d0d0a;color:#9a927d;border:1px solid #3a352a;border-radius:3px;padding:8px;"></textarea>
<script>
/*
 * Collected from the top of the file, before anything is tested, because these fire once and are gone.
 *
 * A Content-Security-Policy that forbids media is invisible to script -- a header-delivered policy cannot be
 * read back -- but blocking one fires `securitypolicyviolation`, and that event names the directive. An element
 * that fails because a policy refused the request looks identical to one that failed because the file is wrong,
 * until this line is on the page.
 */
const violations = [];
const thrown = [];
document.addEventListener("securitypolicyviolation", (event) => {
  violations.push(`${event.violatedDirective} blocked ${event.blockedURI} (policy: ${event.originalPolicy || "?"})`);
});
window.addEventListener("error", (event) => {
  if (event.target && event.target.tagName === "AUDIO") {
    thrown.push(`audio element error on ${event.target.currentSrc || event.target.src || "(no src)"}`);
  } else if (event.message) {
    thrown.push(`${event.message} @ ${event.filename}:${event.lineno}`);
  }
}, true);
window.addEventListener("unhandledrejection", (event) => {
  thrown.push(`unhandled rejection: ${(event.reason && (event.reason.message || event.reason.name)) || event.reason}`);
});

const out = document.getElementById("out");
/** Every line, in order, as plain text. The screenshot became unreadable long before the report did. */
const lines = [];
const head = (text) => {
  const h = document.createElement("h2");
  h.textContent = text;
  out.append(h);
  lines.push("", "=== " + text + " ===");
};
const row = (text, cls = "dim") => {
  const d = document.createElement("div");
  d.className = "row " + cls;
  d.textContent = text;
  out.append(d);
  lines.push(cls === "fail" ? "[FAIL] " + text : cls === "pass" ? "[ok]   " + text : "       " + text);
  return d;
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const NETWORK = ["EMPTY", "IDLE", "LOADING", "NO_SOURCE"];
const ERRORS = { 1: "ABORTED", 2: "NETWORK", 3: "DECODE", 4: "SRC_NOT_SUPPORTED" };

/**
 * Attach an element to a source and report everything it does about it.
 *
 * The event log is the point. `readyState 0` with `error 4` says the element gave up; the order of events before
 * that says whether it ever asked the network for anything, which is the difference between a file it will not
 * accept and a request it never made.
 */
async function probeElement(label, src, seconds = 3) {
  const el = new Audio();
  el.preload = "auto";
  const log = [];
  const names = ["loadstart", "progress", "suspend", "stalled", "waiting", "loadedmetadata",
                 "loadeddata", "canplay", "playing", "abort", "emptied", "error"];
  for (const name of names) el.addEventListener(name, () => log.push(name));
  document.body.append(el);
  el.src = src;
  let refused = null;
  try { await el.play(); } catch (e) { refused = (e && e.name) || String(e); }
  const from = el.currentTime;
  await wait(seconds * 1000);
  const moved = el.currentTime - from;
  // "It decoded and the clock ran", not "it ran for the whole window". A 1.18s file measured over three seconds
  // finishes and reads as a failure otherwise, which is a false alarm in the one row that is meant to be the
  // control.
  const ok = !refused && !el.error && el.readyState >= 3 && moved > 0.15;
  row(`${label} — ${ok ? "PLAYS" : "FAILS"}`, ok ? "pass" : "fail");
  row(`   networkState=${NETWORK[el.networkState]} readyState=${el.readyState} moved=${moved.toFixed(2)}s`
    + ` paused=${el.paused} muted=${el.muted} volume=${el.volume}`);
  row(`   error=${el.error ? `${el.error.code} ${ERRORS[el.error.code] || "?"}` : "none"}`
    + `${el.error && el.error.message ? ` msg="${el.error.message}"` : ""}`
    + `${refused ? ` play()=${refused}` : ""}`);
  // Truncated: a data: URI is tens of thousands of characters and would bury everything else in the screenshot.
  const resolved = el.currentSrc || "(never resolved a source)";
  row(`   resolved: ${resolved.length > 90 ? resolved.slice(0, 90) + `… (${resolved.length} chars)` : resolved}`);
  row(`   events: ${log.join(" ") || "(NONE FIRED AT ALL — the element never even tried)"}`,
    log.length ? "dim" : "fail");
  el.pause();
  el.removeAttribute("src");
  el.remove();
  return ok;
}

/** A half-second sine as a WAV, built here. The control: if this fails, no media element works in this browser. */
function toneWavBytes() {
  const rate = 22050, secs = 0.5, n = Math.floor(rate * secs);
  const bytes = new Uint8Array(44 + n * 2);
  const view = new DataView(bytes.buffer);
  const ascii = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  ascii(0, "RIFF"); view.setUint32(4, 36 + n * 2, true); ascii(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, "data"); view.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) view.setInt16(44 + i * 2, Math.sin((i / rate) * 440 * 2 * Math.PI) * 8000, true);
  return bytes;
}

const FILES = ["bgm-explore.m4a", "bgm-explore.mp3", "brickbreak.m4a"];

async function runAll() {
  const button = document.getElementById("run");
  button.disabled = true;
  button.textContent = "RUNNING…";
  out.innerHTML = "";
  lines.length = 0;
  document.getElementById("copy").disabled = true;

  head("ENVIRONMENT");
  row(navigator.userAgent);
  row(`page: ${location.href}`);
  row(`origin: ${location.origin} — a media URL resolves against this, and the site redirects apex to www`);
  if (navigator.getAutoplayPolicy) {
    try { row(`getAutoplayPolicy(mediaelement): ${navigator.getAutoplayPolicy("mediaelement")}`); } catch { /* not here */ }
  }
  row(`audioSession: ${navigator.audioSession ? navigator.audioSession.type : "(not exposed)"}`);
  const controller = navigator.serviceWorker && navigator.serviceWorker.controller;
  row(`service worker controlling this page: ${controller ? "YES — " + controller.scriptURL : "no"}`,
    controller ? "info" : "dim");
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    row(`registrations: ${regs.length}`);
  }
  const caches_ = typeof caches !== "undefined" ? await caches.keys() : [];
  row(`caches: ${caches_.join(", ") || "(none)"}`);
  const probe = document.createElement("audio");
  row(`canPlayType — opus:"${probe.canPlayType('audio/ogg; codecs="opus"')}"`
    + ` m4a:"${probe.canPlayType('audio/mp4; codecs="mp4a.40.2"')}"`
    + ` mp3:"${probe.canPlayType("audio/mpeg")}"`
    + ` wav:"${probe.canPlayType("audio/wav")}"`);
  if (navigator.mediaCapabilities) {
    for (const type of ['audio/mp4; codecs="mp4a.40.2"', "audio/mpeg"]) {
      try {
        const info = await navigator.mediaCapabilities.decodingInfo({ type: "file", audio: { contentType: type } });
        row(`mediaCapabilities file ${type} — supported=${info.supported} smooth=${info.smooth}`);
      } catch (e) { row(`mediaCapabilities ${type} — threw ${(e && e.message) || e}`); }
    }
  }

  head("CONTROL — DOES ANY MEDIA ELEMENT WORK HERE?");
  row("A half-second 440Hz WAV built in this page. Nothing to do with the game's files or the network.");
  const bytes = toneWavBytes();
  let binary = "";
  for (const b of bytes) binary += String.fromCharCode(b);
  await probeElement("data: URI WAV", "data:audio/wav;base64," + btoa(binary), 1);
  const controlBlob = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
  await probeElement("blob: URL WAV", controlBlob, 1);
  URL.revokeObjectURL(controlBlob);

  head("THE GAME'S FILES, OVER THE NETWORK");
  for (const file of FILES) await probeElement(`element <- /music/${file}`, `music/${file}`);

  head("THE SAME FILES, FROM BYTES ALREADY IN MEMORY");
  row("If these play and the ones above do not, the files are fine and the fetching is the problem.");
  for (const file of FILES) {
    try {
      const response = await fetch(`music/${file}`);
      const type = response.headers.get("content-type") || "";
      const buffer = await response.arrayBuffer();
      row(`/music/${file} — HTTP ${response.status} type="${type}" bytes=${buffer.byteLength}`,
        response.ok ? "dim" : "fail");
      const url = URL.createObjectURL(new Blob([buffer], { type: type.split(";")[0] }));
      await probeElement(`element <- blob of ${file}`, url);
      URL.revokeObjectURL(url);
    } catch (e) {
      row(`/music/${file} — fetch threw ${(e && e.message) || e}`, "fail");
    }
  }

  head("WHAT THE SERVER SAYS TO A RANGE REQUEST");
  row("A media element asks for byte ranges. A plain fetch does not, which is why the two can disagree.");
  for (const file of FILES) {
    try {
      const response = await fetch(`music/${file}`, { headers: { Range: "bytes=0-1023" } });
      row(`${file} — HTTP ${response.status}`
        + ` content-range="${response.headers.get("content-range") || "(none)"}"`
        + ` accept-ranges="${response.headers.get("accept-ranges") || "(none)"}"`
        + ` type="${response.headers.get("content-type") || "(none)"}"`,
        response.status === 206 ? "pass" : "fail");
    } catch (e) { row(`${file} — range fetch threw ${(e && e.message) || e}`, "fail"); }
  }

  head("WEB AUDIO — THE PATH THE SOUND EFFECTS TAKE");
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") await ctx.resume();
    row(`AudioContext state=${ctx.state} sampleRate=${ctx.sampleRate}`, ctx.state === "running" ? "pass" : "fail");
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.08;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
    await wait(600);
    row("a 440Hz tone should have sounded just now", "info");
    for (const file of FILES) {
      try {
        const buffer = await ctx.decodeAudioData(await (await fetch(`music/${file}`)).arrayBuffer());
        row(`decodeAudioData ${file} — ok ${buffer.duration.toFixed(2)}s ${buffer.numberOfChannels}ch`, "pass");
      } catch (e) { row(`decodeAudioData ${file} — FAILED ${(e && (e.message || e.name)) || e}`, "fail"); }
    }
  } catch (e) { row(`AudioContext threw ${(e && e.message) || e}`, "fail"); }

  head("ANYTHING THE BROWSER REFUSED OR THREW");
  if (violations.length) for (const v of violations) row("CSP: " + v, "fail");
  else row("no Content-Security-Policy violations reported");
  if (thrown.length) for (const t of thrown) row("thrown: " + t, "fail");
  else row("nothing thrown");

  head("DONE");
  row("Press COPY REPORT and paste it. The text carries more than a screenshot can.", "info");
  const dump = document.getElementById("dump");
  dump.value = lines.join("\n");
  dump.hidden = false;
  const copy = document.getElementById("copy");
  copy.disabled = false;
  copy.textContent = "COPY REPORT";
  button.textContent = "RUN AGAIN";
  button.disabled = false;
}

document.getElementById("copy").addEventListener("click", async () => {
  const copy = document.getElementById("copy");
  const text = document.getElementById("dump").value;
  try {
    await navigator.clipboard.writeText(text);
    copy.textContent = "COPIED";
  } catch {
    // Refused, which some browsers do outside a trusted context. The textarea below is already selectable, so
    // select it for them rather than leaving them to guess.
    const dump = document.getElementById("dump");
    dump.focus();
    dump.select();
    copy.textContent = "SELECTED — PRESS CMD-C";
  }
});

document.getElementById("run").addEventListener("click", runAll);
document.getElementById("killsw").addEventListener("click", async () => {
  if (navigator.serviceWorker) {
    for (const reg of await navigator.serviceWorker.getRegistrations()) await reg.unregister();
  }
  if (typeof caches !== "undefined") {
    for (const key of await caches.keys()) await caches.delete(key);
  }
  out.innerHTML = "";
  row("service workers unregistered and caches deleted. Re-running without them.", "info");
  await runAll();
});
</script>
</body>
</html>
